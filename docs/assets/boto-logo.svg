<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 196 64" role="img" aria-label="Boto">
  <title>Boto</title>
  <!-- Ruby mark: two flat tones and four facet lines -->
  <polygon points="16,10 48,10 60,24 4,24" fill="#e0473f"/>
  <polygon points="4,24 60,24 32,56" fill="#cc342d"/>
  <g stroke="#ffffff" stroke-opacity="0.45" stroke-width="1.5" stroke-linecap="round" fill="none">
    <path d="M16 10 L24 24 L32 56 L40 24 L48 10"/>
  </g>
  <!-- Wordmark -->
  <text x="72" y="45" font-size="38" font-weight="700" letter-spacing="-0.5" fill="#1f1f24"
        font-family="'Avenir Next', Avenir, 'Segoe UI Variable Display', 'Segoe UI', Montserrat, Nunito, system-ui, sans-serif">Boto</text>
</svg>
