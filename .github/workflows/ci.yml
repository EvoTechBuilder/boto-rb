name: CI

on:
  push:
    branches: [main]
    # A version tag runs the tests, then publishes to RubyGems in parallel with the benchmark.
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (ruby ${{ matrix.ruby }}, yjit ${{ matrix.yjit }})
    runs-on: ubuntu-latest
    # A hung test (e.g. a server that never stops) must not hold the runner for GitHub's 6-hour default.
    timeout-minutes: 15
    continue-on-error: ${{ matrix.ruby == 'head' }}
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.4", "4.0", "head"]
        yjit: [true, false]
    # boto-rb-redis tests need a real Redis; locally they skip when none is reachable.
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      RUBY_YJIT_ENABLE: ${{ matrix.yjit && '1' || '' }}
      REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Run tests
        run: bundle exec rake test

  benchmark:
    name: benchmark (vs base)
    # Pull requests compare with their base branch, pushes to main with the commit before the push and
    # version tags with the previous version tag. Without a base (a new branch, the first tag) it is skipped.
    needs: test
    runs-on: ubuntu-latest
    # A stuck server or load tool must not hold the runner for GitHub's 6-hour default.
    timeout-minutes: 30
    # Redis for the db_auth_redis scenario; without it the scenario is skipped.
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      RUBY_YJIT_ENABLE: "1"
      REDIS_URL: redis://localhost:6379/15
    steps:
      - name: Checkout current
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve base
        id: base_ref
        env:
          BEFORE: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            ref="$BASE_REF"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            ref=$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null || true)
          elif [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            ref="$BEFORE"
          fi
          echo "ref=${ref:-}" >> "$GITHUB_OUTPUT"
          [ -n "${ref:-}" ] || echo "::notice::No base to compare with; skipping the benchmark."

      - name: Checkout base
        if: steps.base_ref.outputs.ref != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.base_ref.outputs.ref }}
          path: base

      - name: Install wrk
        run: sudo apt-get update && sudo apt-get install -y wrk

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"

      - name: Check base has benchmarks
        id: base
        env:
          BASE: ${{ steps.base_ref.outputs.ref }}
        run: |
          if [ -n "$BASE" ] && [ -f "$GITHUB_WORKSPACE/base/benchmarks/run.rb" ]; then
            echo "has_base=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_base=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Base branch has no benchmarks/run.rb; skipping comparison."
          fi

      - name: Save baseline from base branch
        if: steps.base.outputs.has_base == 'true'
        timeout-minutes: 15
        # The base measures itself with its own scripts: a scenario added by the PR may need code the base lacks.
        # The PR's --compare skips scenarios missing from the baseline.
        run: |
          cd "$GITHUB_WORKSPACE/base/benchmarks"
          BOTO_ROOT="$GITHUB_WORKSPACE/base" bundle install
          BOTO_ROOT="$GITHUB_WORKSPACE/base" bundle exec ruby run.rb --save-baseline
          mkdir -p "$GITHUB_WORKSPACE/benchmarks/results"
          cp results/baseline.json "$GITHUB_WORKSPACE/benchmarks/results/baseline.json"

      - name: Compare current against baseline
        if: steps.base.outputs.has_base == 'true'
        timeout-minutes: 15
        run: |
          cd "$GITHUB_WORKSPACE/benchmarks"
          BOTO_ROOT="$GITHUB_WORKSPACE" bundle install
          BOTO_ROOT="$GITHUB_WORKSPACE" bundle exec ruby run.rb --compare

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          # Falcon logs explain a server that did not start or a check that failed.
          path: |
            benchmarks/results/*.json
            benchmarks/results/logs/
            base/benchmarks/results/logs/
          if-no-files-found: ignore

  publish:
    name: publish to RubyGems
    # Only version tags publish, and only after every test job passed. It runs next to the benchmark.
    if: github.ref_type == 'tag'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Protection rules on this environment (required reviewers) can gate every release.
    environment: rubygems
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"

      # Builds in dependency order. gem build names the file after the gemspec version,
      # so a tag that does not match every gem's VERSION fails here, before anything is pushed.
      - name: Build gems
        run: |
          version="${GITHUB_REF_NAME#v}"
          for gem in boto-rb boto-rb-security boto-rb-redis boto-rb-swaggerui boto-rb-data boto-rb-cli; do
            (cd "gems/$gem" && gem build "$gem.gemspec")
            test -f "gems/$gem/$gem-$version.gem" || { echo "::error::$gem is not at version $version"; exit 1; }
          done

      - uses: rubygems/configure-rubygems-credentials@v2.2.0

      # Pushes, in dependency order, the gems that already exist on RubyGems. A version already there is
      # skipped, so a release that failed halfway can be pushed again. A gem RubyGems has never seen is
      # left for the next step, which needs the owner of its pending trusted publisher.
      - name: Push gems
        id: push
        run: |
          version="${GITHUB_REF_NAME#v}"
          new_gems=""
          for gem in boto-rb boto-rb-security boto-rb-redis boto-rb-swaggerui boto-rb-data boto-rb-cli; do
            if curl -sf "https://rubygems.org/api/v2/rubygems/$gem/versions/$version.json" > /dev/null; then
              echo "$gem $version is already on RubyGems; skipping"
            elif curl -sf "https://rubygems.org/api/v1/gems/$gem.json" > /dev/null; then
              gem push "gems/$gem/$gem-$version.gem"
            else
              new_gems="$new_gems $gem"
            fi
          done
          echo "new_gems=${new_gems# }" >> "$GITHUB_OUTPUT"

      # The action refuses to overwrite a key in ~/.gem/credentials, so the first one is removed before the
      # exchange below.
      - name: Drop the first RubyGems key
        if: steps.push.outputs.new_gems != ''
        run: rm -f ~/.gem/credentials

      # The first push of a new gem goes through its pending trusted publisher on RubyGems, which must name
      # the account that will own it (an immutable account ID, not a secret).
      - uses: rubygems/configure-rubygems-credentials@v2.2.0
        if: steps.push.outputs.new_gems != ''
        with:
          owner: "246924"

      - name: Push new gems
        if: steps.push.outputs.new_gems != ''
        env:
          NEW_GEMS: ${{ steps.push.outputs.new_gems }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          for gem in $NEW_GEMS; do
            gem push "gems/$gem/$gem-$version.gem"
          done
